# En cada push y PR: lint, tipos y tests. Lo mismo que se corre local antes
# de commitear, pero garantizado — es lo que respalda el badge del README.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # la misma major que la imagen Docker (node:22-alpine)
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # La imagen de producción tiene que construir siempre: es lo que despliega
  # actualizar.sh en la VM. Solo build, no publica nada.
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
