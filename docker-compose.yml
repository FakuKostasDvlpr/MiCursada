services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: micursada:local
    container_name: micursada
    ports:
      - "3000:3000"
    volumes:
      # Bind mount: el snapshot del aula virtual y los overlays de edición
      # viven en ./datos y se ven/editan desde Windows. Regenerá el snapshot
      # con `npm run exportar` en el repo cursada-sync (escribe acá mismo).
      - ./datos:/app/datos
    environment:
      NODE_ENV: production
      CURSADA_DATOS_DIR: /app/datos
      # Para entrar se usa el usuario y la contraseña del aula virtual. No hay
      # variable para saltear el login.
      # Este compose es para correr LOCAL en tu PC. El de producción (VM, con
      # Caddy, HTTPS y lista de habilitados) está en despliegue/compose.yml.
    restart: unless-stopped
